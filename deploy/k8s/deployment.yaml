apiVersion: apps/v1
kind: Deployment
metadata:
  name: attack-surface-service
  labels:
    app: attack-surface-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attack-surface-service
  template:
    metadata:
      labels:
        app: attack-surface-service
    spec:
      containers:
        - name: api
          image: attack-surface-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: ENV_PATH
              value: tests/cloud.json
            - name: LOG_FORMAT
              value: json
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
